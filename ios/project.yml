name: MiSphere360
options:
  bundleIdPrefix: com.ssombra
  deploymentTarget:
    iOS: "16.0"

packages:
  VLCKit:
    url: https://github.com/rsalesas/VLCKit.git
    from: 3.6.6

targets:
  MiSphere360:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VLCKit
        product: VLCKit
    settings:
      base:
        PRODUCT_NAME: "Mi Sphere 360"
        PRODUCT_BUNDLE_IDENTIFIER: com.ssombra.misphere360
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone y iPad
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MiSphere360-Bridging-Header.h
